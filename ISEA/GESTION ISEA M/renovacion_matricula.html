<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Firma Digital - ISEA</title>
  <link rel="shortcut icon" href="IMAGENES/ISEA-removebg-preview (1).png" type="image/x-icon">
  <link rel="stylesheet" href="renovacion de matricula.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
        integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
</head>
<body>
  <header>
    <div id="header-container">
      <img src="IMAGENES/ISEAblanca-sin-fondo.png" id="logo" alt="">
      <h1>Renovación de Matrícula</h1>
      <nav style="text-align: right;">
        <button id="back-button" onclick="window.location.href='panel_estudiante.php'">Atrás</button>
      </nav>
    </div>
  </header>

  <main class="form-container">
    <h2>Información Personal</h2>

    <!-- formulario -->
    <form id="registrationForm" aria-labelledby="registrationForm" novalidate enctype="multipart/form-data">
      <div class="form-group">
        <label for="tipoDocumento">Tipo de Documento</label>
        <select id="tipoDocumento" name="tipoDocumento" class="docs" required>
          <option value="" disabled selected>Seleccione</option>
          <option value="extranjero">Cédula extranjera</option>
          <option value="ti">TI</option>
          <option value="cc">CC</option>
        </select>
        <div class="error-message" id="tipoDocumentoError" style="display: none;">Este campo es obligatorio.</div>
      </div>

      <div class="form-group">
        <label for="documento">Número de Documento</label>
        <input type="text" id="documento" name="documento" required aria-required="true">
        <div class="error-message" id="documentoError" style="display: none;">Este campo es obligatorio.</div>
      </div>

      <div class="signature-container">
        <h2>Firma Digital</h2>
        <canvas id="signature-pad"></canvas>

        <div class="form-group" style="margin-top:10px;">
          <label for="archivoFirma">Adjuntar firma (imagen o PDF, opcional)</label>
          <input type="file" id="archivoFirma" name="archivoFirma" accept="image/*,application/pdf">
          <small>Puedes dibujar en el cuadro o adjuntar un archivo.</small>
        </div>

        <div>
          <button type="button" id="clear-button">Limpiar</button>
          <button type="button" id="save-button">Guardar Firma</button>
        </div>
      </div>
    </form>

    <div id="msg" style="margin-top:16px; display:none;"></div>
  </main>


  <script src="renovacion.js"></script>
</body>
</html>
